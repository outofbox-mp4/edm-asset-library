<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDM Asset Library</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="shell"><div id="header"></div><section class="intro"><div><div class="eyebrow" style="color:#087461">Asset overview</div><h2>把每一封邮件沉淀成可复用资产。</h2></div><p>从活动灵感、组件规范到已验证的投放 HTML，都在同一套管理框架里。</p></section><section class="stats"><div class="stat"><b id="templates-count"></b> 个自有模板</div><div class="stat"><b id="verified-count"></b> 个已验证</div><div class="stat"><b id="resources-count"></b> 个 GitHub 资源</div><div class="stat">Black Friday 2026</div></section><section class="grid" id="featured"></section><section class="notice" style="margin-top:22px"><h3>建议的长期管理方式</h3><p>自有模板只收录可发送版本；所有草稿保留在项目文件夹。每次活动结束后，在资产详情中补齐主题行、CTA、分层、发送时间与表现数据，为下一次选型提供依据。</p></section><div id="footer"></div></main><script src="assets/data.js"></script><script src="assets/site.js"></script><script>document.querySelector('#header').innerHTML=pageHeader('home');const d=EDM_LIBRARY;document.querySelector('#templates-count').textContent=d.templates.length;document.querySelector('#verified-count').textContent=d.templates.filter(x=>x.status==='已验证').length;document.querySelector('#resources-count').textContent=d.resources.length;document.querySelector('#featured').innerHTML=d.templates.slice(0,3).map(templateCard).join('');document.querySelector('#footer').innerHTML=footer();</script></body></html>
