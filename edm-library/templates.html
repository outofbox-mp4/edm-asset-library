<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自有模板 · EDM Asset Library</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="shell"><div id="header"></div><section class="intro"><div><div class="eyebrow" style="color:#087461">Owned library</div><h2>Octoparse 自有模板库</h2></div><p>只包含可直接用于 Mailchimp 的品牌资产。点击“资产详情”查看主题行、Preheader、CTA 和投放检查项。</p></section><div class="filters"><input id="search" class="search" type="search" placeholder="搜索：Early Bird、Pro、试用、AI Assistant…"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="早鸟价">早鸟价</button><button class="filter" data-filter="正式活动">正式活动</button><button class="filter" data-filter="付费用户">付费用户</button><button class="filter" data-filter="免费">免费 / 试用 / 流失</button></div><section id="grid" class="grid"></section><div id="empty" class="empty">没有匹配的模板。</div><div id="footer"></div></main><script src="assets/data.js"></script><script src="assets/site.js"></script><script>document.querySelector('#header').innerHTML=pageHeader('templates');document.querySelector('#footer').innerHTML=footer();const all=EDM_LIBRARY.templates,grid=document.querySelector('#grid'),search=document.querySelector('#search'),empty=document.querySelector('#empty');let active='all';function draw(){let q=search.value.toLowerCase().trim(),shown=all.filter(t=>{let txt=(t.name+t.desc+t.tags.join(' ')+t.audience).toLowerCase();let ok=!q||txt.includes(q);if(active==='早鸟价'||active==='正式活动')ok&&=t.phase===active;else if(active==='付费用户')ok&&=t.audience==='付费用户';else if(active==='免费')ok&&=t.audience!=='付费用户';return ok});grid.innerHTML=shown.map(templateCard).join('');empty.style.display=shown.length?'none':'block'}search.addEventListener('input',draw);document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.filter.active').classList.remove('active');b.classList.add('active');active=b.dataset.filter;draw()}));draw();</script></body></html>
