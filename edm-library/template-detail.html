<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模板详情 · EDM Asset Library</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="shell"><div id="header"></div><section class="intro"><div><div class="eyebrow">Template record</div><h2 id="title">模板详情</h2></div><p id="desc"></p></section><div class="stats" id="meta"></div><section class="tablewrap"><table class="table"><tbody id="table"></tbody></table></section><div class="actions" id="actions"></div><section class="notice"><h3>发送前检查</h3><p>确认 Logo 已替换为公网 URL；CTA 与 UTM 已更新；人群、主题行与 Preheader 匹配；在 Gmail、Outlook、移动端和 Mailchimp 预览中完成检查。</p></section><div id="footer"></div></main><script src="assets/data.js"></script><script src="assets/site.js"></script><script>document.querySelector('#header').innerHTML=pageHeader('templates');let id=new URLSearchParams(location.search).get('id'),t=templateRecords().find(x=>x.id===id)||templateRecords()[0];document.title=t.name+' · EDM Asset Library';document.querySelector('#title').textContent=t.name;document.querySelector('#desc').textContent=t.desc;document.querySelector('#meta').innerHTML=`<div class="stat">阶段：<b>${t.phase}</b></div><div class="stat">人群：<b>${t.audience}</b></div><div class="stat">目标：<b>${t.goal}</b></div><div class="stat">状态：<b>${t.status}</b></div>`;document.querySelector('#table').innerHTML=`<tr><th>主题行</th><td>${t.subject}</td></tr><tr><th>Preheader</th><td>${t.preheader}</td></tr><tr><th>主 CTA</th><td>${t.cta}</td></tr><tr><th>标签</th><td>${t.tags.join(' · ')} <button class="tag-edit" type="button" onclick="editTemplateTags('${t.id}')">编辑标签</button></td></tr><tr><th>源文件</th><td>${t.file}</td></tr>`;document.querySelector('#actions').innerHTML=`<a class="btn primary" href="${t.file}" target="_blank">预览模板</a><a class="btn" href="templates.html">返回模板库</a>`;document.querySelector('#footer').innerHTML=footer();</script></body></html>
