<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="EDM 模板、参考资源和标准文档的轻量索引。">
  <title>EDM 档案索引</title>
  <style>
    :root{color-scheme:light;--ink:#222624;--muted:#69716d;--line:#e1e4e0;--bg:#f8f9f7;--paper:#fff;--accent:#465d51}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    a{color:inherit;text-decoration:none}button,input{font:inherit}a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .shell{max-width:1080px;margin:auto;padding:32px 36px 72px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}
    .identity{font-weight:700;letter-spacing:.025em;font-size:17px}.identity span{color:var(--muted);font-weight:400}.back{font-size:13px;color:var(--accent);border-bottom:1px solid #9bab9f;padding-bottom:2px}
    .layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:52px;padding-top:42px}.sidebar{align-self:start;position:sticky;top:28px}.sidebar b{display:block;font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:12px}.sidebar a{display:block;padding:9px 10px;margin:2px 0;border-radius:5px;color:#4f5752;font-size:14px}.sidebar a:hover,.sidebar a:focus-visible{background:#e9eeea;color:#17251c}
    h1{font-size:30px;line-height:1.2;letter-spacing:-.03em;margin:0 0 9px}.intro{margin:0 0 24px;color:var(--muted);font-size:14px}.search{width:min(440px,100%);height:40px;padding:8px 12px;border:1px solid #cdd4ce;border-radius:5px;background:var(--paper);margin-bottom:25px}.search::placeholder{color:#89918c}
    .group{margin:0 0 31px}.group h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:9px}.group h2 small{font-weight:400;color:var(--muted);font-size:12px}.rows{border:1px solid var(--line);border-radius:7px;background:var(--paper);overflow:hidden}.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:64px;padding:12px 17px;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row:hover{background:#f4f7f3}.glyph{display:grid;place-items:center;width:29px;height:29px;border:1px solid #cdd7cf;border-radius:5px;color:var(--accent);font-size:16px}.row strong{display:block;font-size:14px;font-weight:650}.row span.meta{display:block;font-size:12px;color:var(--muted);margin-top:2px}.arrow{color:#87918a;font-size:17px}.row:hover .arrow{color:var(--accent)}.row[hidden],.group[hidden]{display:none}.empty{color:var(--muted);font-size:14px;display:none;padding:16px 0}.empty.show{display:block}
    footer{border-top:1px solid var(--line);margin-top:44px;padding-top:18px;font-size:12px;color:var(--muted)}
    @media(max-width:720px){.shell{padding:24px 18px 56px}.layout{display:block;padding-top:30px}.sidebar{position:static;display:flex;flex-wrap:wrap;gap:4px;margin:0 0 30px}.sidebar b{width:100%;margin-bottom:4px}.sidebar a{padding:6px 9px}.top{align-items:flex-start}.back{white-space:nowrap}h1{font-size:26px}}
  </style>
  <link rel="stylesheet" href="assets/archive.css">
</head>
<body>
  <div class="shell">
    <header class="top"><a class="identity" href="#index">EDM <span>/ Archive</span></a></header>
    <div class="layout">
      <nav class="sidebar" aria-label="档案目录"><b>目录</b><a href="#owned">自有资产</a><a href="#references">参考资料</a><a href="#standards">标准与维护</a></nav>
      <main>
        <div id="archive-home">
        <h1>邮件营销资产索引</h1>
        <p class="intro">在这里找到原始模板、参考资料和维护文档。</p>
        <input class="search" id="archive-search" type="search" placeholder="搜索档案名称" aria-label="搜索档案名称">

        <section class="group" id="owned"><h2>自有资产</h2><div class="rows">
          <a class="row" href="#templates"><span class="glyph" aria-hidden="true">▤</span><span><strong>邮件模板</strong><span class="meta">按营销阶段和用户分层浏览</span></span><span class="arrow" aria-hidden="true">→</span></a>
          <a class="row" href="#components"><span class="glyph" aria-hidden="true">▦</span><span><strong>内容组件</strong><span class="meta">可复用的邮件模块</span></span><span class="arrow" aria-hidden="true">→</span></a>
        </div></section>

        <section class="group" id="references"><h2>参考资料</h2><div class="rows">
          <a class="row" href="#resources"><span class="glyph" aria-hidden="true">☆</span><span><strong>外部资源</strong><span class="meta">视觉、内容模块和规模化工具</span></span><span class="arrow" aria-hidden="true">→</span></a>
          <a class="row" href="#examples"><span class="glyph" aria-hidden="true">⌁</span><span><strong>资源使用示例</strong><span class="meta">如何将参考资源用于实际邮件</span></span><span class="arrow" aria-hidden="true">→</span></a>
        </div></section>

        <section class="group" id="standards"><h2>标准与维护</h2><div class="rows">
          <a class="row" href="#framework"><span class="glyph" aria-hidden="true">✓</span><span><strong>标准与行业基准原稿</strong><span class="meta">五项金标准、Agent 评判及 SaaS 基准</span></span><span class="arrow" aria-hidden="true">→</span></a>
          <a class="row" href="#guidelines"><span class="glyph" aria-hidden="true">≡</span><span><strong>发送与入库规范</strong><span class="meta">质量检查和模板管理规则</span></span><span class="arrow" aria-hidden="true">→</span></a>
          <a class="row" href="#maintenance"><span class="glyph" aria-hidden="true">⌘</span><span><strong>维护说明</strong><span class="meta">在 GitHub 更新资产目录</span></span><span class="arrow" aria-hidden="true">→</span></a>
        </div></section>
        <p class="empty" id="empty">没有匹配的档案。</p>
        </div>
        <section id="archive-detail" class="archive-detail" hidden aria-live="polite"></section>
      </main>
    </div>
    <footer>EDM Asset Library · 档案索引</footer>
  </div>
  <script src="assets/data.js"></script>
  <script src="assets/component-snippets.js"></script>
  <script src="assets/archive.js"></script>
</body>
</html>
