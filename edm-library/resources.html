<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub 资源 · EDM Asset Library</title><link rel="stylesheet" href="assets/site.css"><style>.resource-group{margin-top:34px}.resource-group:first-of-type{margin-top:0}.resource-group h3{margin:0 0 5px;font-size:22px}.resource-group>p{margin:0 0 14px;color:#62656d}.group-kicker{font-size:11px;font-weight:700;letter-spacing:1.2px;color:#087461}</style></head><body><main class="shell"><div id="header"></div><section class="intro"><div><div class="eyebrow" style="color:#087461">External resources</div><h2>GitHub EDM 资源库</h2></div><p>按“视觉风格、内容模块、规模化维护”三层使用外部资源；它们不是可直接发送的品牌模板。</p></section><a class="btn primary" href="resource-examples.html" style="margin:0 0 22px">先看：这些资源在邮件中怎么用 →</a><section id="groups"></section><section class="notice" style="margin-top:24px"><h3>纳入自有库前</h3><p>应重新设计品牌元素、检查授权、替换全部文案/链接，并完成目标客户端测试。星标数为 2026-11 检索时约数。</p></section><div id="footer"></div></main><script src="assets/data.js"></script><script src="assets/site.js"></script><script>document.querySelector('#header').innerHTML=pageHeader('resources');const groupMeta={visual:{label:'01 · VISUAL DIRECTION',title:'视觉风格库',desc:'用于决定整封营销邮件的视觉气质、内容节奏和版式方向。'},modules:{label:'02 · CONTENT FOUNDATION',title:'内容模块库',desc:'用于解决单列布局、按钮、移动端、CSS 内联与客户端兼容等基础问题。'},scale:{label:'03 · SCALABLE WORKFLOW',title:'规模化邮件库',desc:'用于建立组件 + 变量 + 构建的工作流，覆盖生命周期与多语言长期维护。'}};const card=r=>`<article class="resource"><div class="resourcetop"><div><h3>${r.name}</h3><span class="repo">${r.repo}</span></div><span class="stars">★ ${r.stars}</span></div><p>${r.use}</p><div class="meta"><span class="tag">${r.type}</span></div><a href="${r.url}" target="_blank" rel="noopener">查看 GitHub →</a></article>`;document.querySelector('#groups').innerHTML=Object.entries(groupMeta).map(([key,g])=>`<section class="resource-group"><div class="group-kicker">${g.label}</div><h3>${g.title}</h3><p>${g.desc}</p><div class="resource-grid">${EDM_LIBRARY.resources.filter(r=>r.category===key).map(card).join('')}</div></section>`).join('');document.querySelector('#footer').innerHTML=footer();</script></body></html>
