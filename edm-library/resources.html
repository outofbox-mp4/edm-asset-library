<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub 资源 · EDM Asset Library</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="shell"><div id="header"></div><section class="intro"><div><div class="eyebrow" style="color:#087461">External resources</div><h2>GitHub EDM 资源库</h2></div><p>按“视觉模板、兼容性模式、工程框架”筛选灵感。外部资源不等于可直接发送的品牌模板。</p></section><a class="btn primary" href="resource-examples.html" style="margin:0 0 22px">先看：这些资源在邮件中怎么用 →</a><section id="grid" class="resource-grid"></section><section class="notice" style="margin-top:24px"><h3>纳入自有库前</h3><p>应重新设计品牌元素、检查授权、替换全部文案/链接，并完成目标客户端测试。星标数为 2026-11 检索时约数。</p></section><div id="footer"></div></main><script src="assets/data.js"></script><script src="assets/site.js"></script><script>document.querySelector('#header').innerHTML=pageHeader('resources');document.querySelector('#grid').innerHTML=EDM_LIBRARY.resources.map(r=>`<article class="resource"><div class="resourcetop"><div><h3>${r.name}</h3><span class="repo">${r.repo}</span></div><span class="stars">★ ${r.stars}</span></div><p>${r.use}</p><div class="meta"><span class="tag">${r.type}</span></div><a href="${r.url}" target="_blank" rel="noopener">查看 GitHub →</a></article>`).join('');document.querySelector('#footer').innerHTML=footer();</script></body></html>
